[agent]
  interval = "5s"
  flush_interval = "2s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  topics = ["iot/environment/+"]
  qos = 1
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "air_quality_raw"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "values.temperature"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "values.humidity"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "values.co2"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "values.pm25"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "values.air_quality"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "values.seq"
      type = "int"

[[outputs.influxdb_v3]]
  urls = ["http://influxdb3:8181"]
  token = "${INFLUX_TOKEN}"
  database = "iot_environment"