[agent]
  interval = "5s"
  flush_interval = "2s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  topics = ["iot/environment/+"]
  qos = 1
  data_format = "json"
  name_override = "environment"
  tag_keys = ["device_id", "location"]
  json_string_fields = ["device_id", "location"]

[[outputs.influxdb_v3]]
  urls = ["http://influxdb3:8181"]
  token = "${INFLUX_TOKEN}"
  database = "iot_environment"
