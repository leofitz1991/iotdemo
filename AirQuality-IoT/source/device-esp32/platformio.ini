; Firmware nut do chat luong khong khi - ESP32 mo phong tren Wokwi
; Moi env = 1 thiet bi (khac NODE_ID -> khac access token, location)
; Build tat ca: pio run      | Build 1 node: pio run -e node01

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14

[env:node01]
build_flags = ${env.build_flags} -DNODE_ID=1

[env:node02]
build_flags = ${env.build_flags} -DNODE_ID=2

[env:node03]
build_flags = ${env.build_flags} -DNODE_ID=3

[env:node04]
build_flags = ${env.build_flags} -DNODE_ID=4

[env:node05]
build_flags = ${env.build_flags} -DNODE_ID=5
