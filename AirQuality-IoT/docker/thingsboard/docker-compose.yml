name: airquality-iot

# ThingsBoard CE + PostgreSQL (theo huong dan Docker chinh thuc cua ThingsBoard)
# Khoi tao lan dau: docker compose -p airquality-iot run --rm -e INSTALL_TB=true -e LOAD_DEMO=true thingsboard-ce
# Chay ThingsBoard: docker compose -p airquality-iot up -d
# InfluxDB opt-in:   docker compose --profile influx up -d influxdb
# Writer opt-in:     docker compose --profile influx up -d influx-writer
# Grafana opt-in:    docker compose --profile influx up -d grafana
services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - tb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2.7
    restart: always
    profiles: ["influx"]
    env_file:
      - ./.env
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-airquality}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?Set INFLUXDB_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-airquality-iot}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-airquality}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?Set INFLUXDB_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:8086:8086" # InfluxDB UI/API accessible only from this host
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 10

  influx-writer:
    image: node:22-alpine
    restart: always
    profiles: ["influx"]
    env_file:
      - ./.env
    working_dir: /app
    command: ["node", "influx_writer.mjs"]
    volumes:
      - ./influx_writer.mjs:/app/influx_writer.mjs:ro
    environment:
      PORT: 3000
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUXDB_ORG:-airquality-iot}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET:-airquality}
      INFLUX_TOKEN: ${INFLUXDB_WRITE_TOKEN:?Create INFLUXDB_WRITE_TOKEN before starting influx-writer}
      WRITER_API_TOKEN: ${WRITER_API_TOKEN:?Set WRITER_API_TOKEN in .env before starting influx-writer}
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cth619_grafana
    restart: always
    profiles: ["influx"]
    ports:
      - "3003:3000"   # Port 3003 may host (tranh xung dot 3000)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - tb-grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy

  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.6
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"   # Web UI + REST API
      - "1883:1883"   # MQTT (ESP32 tren Wokwi ket noi vao day)
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_PASSWORD: postgres
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

volumes:
  tb-postgres-data:
  influxdb-data:
  influxdb-config:
  tb-grafana-data:
